<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>대문- 수정</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
  <link rel="stylesheet" href="/assets/css/main.css"/>
  <style>
    .editable {
      border: 1px dashed #ccc;
      padding: 5px;
      min-width: 200px;
    }
  </style>
</head>
<body class="is-preload">

<!-- Wrapper -->
<div id="wrapper">

  <!-- Main -->
  <div id="main">
    <div class="inner">

      <!-- Header -->
      <header th:replace="~{/layout/header :: header}"></header>

      <!-- Banner -->
      <section id="banner" class="position-relative">
        <div class="content">
          <header>
            <h1 contenteditable="true" class="editable" id="banner-title">대문<br/> 페이지</h1>
            <p contenteditable="true" class="editable" id="banner-description">A free and fully responsive site
                                                                               template</p>
          </header>
          <p contenteditable="true" class="editable" id="banner-content">이 블로그는 단순히 정보를 나누는 공간을 넘어서, 여러분과 함께 성장하고 배우는 장이
                                                                         되기를 바랍니다. 제가 다루는 [주제]에 대해 심도 깊은 정보를 제공하고, 이를 통해
                                                                         여러분의 삶에 실질적인 도움이 될 수 있도록 노력할 것입니다. 또한, 여러분과의
                                                                         소통을 통해 서로 더 나은 방향으로 나가고, 함께 경험을 나누며 더욱 풍성한 내용을
                                                                         만들어갈 수 있기를 희망합니다.</p>
        </div>
        <span class="image object">
          <img src="/images/pic10.jpg" alt="" id="banner-image"/>
        </span>
      </section>
      <button id="save-banner" class="button primary">저장</button>
    </div>
  </div>

  <!-- Sidebar -->
  <div th:replace="~{/layout/sidebar :: sidebar}"></div>

</div>

<!-- Scripts -->
<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/js/browser.min.js"></script>
<script src="/assets/js/breakpoints.min.js"></script>
<script src="/assets/js/util.js"></script>
<script src="/assets/js/main.js"></script>

<script>
  // 저장 버튼 클릭 시 배너 내용 저장
  $('#save-banner').on('click', function () {
    const title = $('#banner-title').text()
    const description = $('#banner-description').text()
    const content = $('#banner-content').text()
    const image = $('#banner-image').attr('src')  // 이미지 URL이 변경되었을 경우

    // 서버에 배너 데이터를 저장하거나 처리하는 API 호출
    $.ajax({
      url: '/saveBanner',
      type: 'POST',
      data: {
        title: title,
        description: description,
        content: content,
        image: image
      },
      success: function (response) {
        alert('배너 내용이 저장되었습니다!')
        // 페이지를 새로고침하거나 반영할 수 있는 처리
        location.reload()
      },
      error: function () {
        alert('배너 저장 실패! 다시 시도해 주세요.')
      }
    })
  })
</script>

</body>
</html>
