<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <title>방명록</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
  <link rel="stylesheet" href="/assets/css/main.css"/>
  <script>
    $(document).ready(function () {
      $('.delete-btn').on('click', function () {
        const seqComment = $(this).data('comment-id')
        if (!seqComment)
        {
          alert('삭제할 방명록이 없습니다.')
          return
        }

        if (!confirm('정말 삭제하시겠습니까?'))
        {
          return
        }
        $.ajax({
          url: '/guestBook/' + seqComment,
          type: 'DELETE',
          success: function (response) {
            if (response.startsWith('redirect:'))
            {
              window.location.href = response.replace('redirect:', '')
            }
          },
          error: function () {
            alert('삭제 실패! 다시 시도해 주세요.')
          }
        })
      })
      $('.like-btn').on('click', function () {
        const commentId = $(this).data('comment-id')
        if (!commentId)
        {
          alert('추천할 방명록이 없습니다.')
          return
        }
        $.ajax({
          url: `/guestBook/${commentId}`,
          type: 'PUT',
          success: function (newLikeCount) {
            $(`#likeCount-${commentId}`).text(newLikeCount)
          },
          error: function (status, error, xhr) {
            console.log('Error Status:', status)
            console.log('Error Details:', error)
            console.log('Server Response:', xhr.responseText)
            alert('추천 실패! 다시 시도해 주세요.')
          }
        })
      })
    })
  </script>
</head>
<body class="is-preload">

<!-- Wrapper -->
<div id="wrapper">

  <!-- Main -->
  <div id="main">
    <div class="inner">

      <!-- Header -->
      <header th:replace="~{/layout/header :: header}"></header>

      <!-- Content -->
      <section>
        <div class="mb-4">
          <h3>방명록</h3>
          <form action="/guestBook" method="post">
            <div class="input-group">
              <input type="text" class="form-control" id="input" name="input" required>
              <button type="submit" class="button primary input-group-text">작성하기</button>
            </div>
          </form>
        </div>
        <div class="table-wrapper">
          <table class="table table-hover">
            <colgroup>
              <col style="width: 60%">
              <col style="width: 15%">
              <col style="width: 17%">
              <col style="width: 8%">
            </colgroup>
            <thead>
            <tr>
              <th>내용</th>
              <th>작성자</th>
              <th>작성일</th>
              <th>추천</th>
            </tr>
            </thead>
            <tbody>
            <form action="#" id="frm" method="post">
              <input type="hidden" id="method" name="_method">
              <tr th:if="${#lists.size(commentList) > 0}" th:each="item : ${commentList}">
                <td th:text="${item.getContent()}"></td>
                <td th:text="${item.getMember_nick().getNickName()}"></td>
                <td th:text="${item.getCreateDate()}"></td>
                <td th:text="${item.getLikeComment()}" th:id="'likeCount-' + ${item.getSeqComment()}"></td>
                <td>
                  <button type="button" class="like-btn" th:data-comment-id="${item.getSeqComment()}">
                    추천
                  </button>
                </td>
                <td>
                  <button type="button" class="delete-btn" th:data-comment-id="${item.getSeqComment()}">삭제
                  </button>
                </td>
              </tr>
            </form>
            </tbody>
          </table>
        </div>

      </section>
    </div>
  </div>

  <!-- Sidebar -->
  <div th:replace="~{/layout/sidebar :: sidebar}"></div>

</div>

<!-- Scripts -->
<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/js/browser.min.js"></script>
<script src="/assets/js/breakpoints.min.js"></script>
<script src="/assets/js/util.js"></script>
<script src="/assets/js/main.js"></script>

</body>
</html>
