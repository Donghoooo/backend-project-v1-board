<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>대문</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
  <link rel="stylesheet" href="/assets/css/main.css"/>
  <style>
    /* 대문 수정 링크 스타일 */
    .edit-link {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 10px;
      color: gray;
      text-decoration: none;
    }
  </style>
</head>
<body class="is-preload">

<!-- Wrapper -->
<div id="wrapper">

  <!-- Main -->
  <div id="main">
    <div class="inner">

      <!-- Header -->
      <header th:replace="~{/layout/header :: header}"></header>

      <!-- Banner -->
      <section id="banner" class="position-relative">
        <a href="" th:href="@{/editBanner}" class="edit-link">대문 수정하기</a>
        <div class="content">
          <header>
            <h1>대문<br/>
                페이지</h1>
            <p>A free and fully responsive site template</p>
          </header>
          <p>이 블로그는 단순히 정보를 나누는 공간을 넘어서, 여러분과 함께 성장하고 배우는 장이 되기를 바랍니다. 제가 다루는 [주제]에 대해 심도 깊은 정보를 제공하고, 이를 통해 여러분의 삶에
             실질적인 도움이 될 수 있도록 노력할 것입니다. 또한, 여러분과의 소통을 통해 서로 더 나은 방향으로 나아가고, 함께 경험을 나누며 더욱 풍성한 내용을 만들어갈 수 있기를 희망합니다.</p>
        </div>
        <span class="image object">
          <img src="/images/pic10.jpg" alt=""/>
        </span>
      </section>
      <!-- Section -->
      <section>
        <header class="major">
          <h2>최근 글</h2>
        </header>
        <div class="posts">
          <article th:if="${#lists.size(indexBoard) > 0}" th:each="item : ${indexBoard} ">
            <h3 th:text="${item.getBoardTitle()}"></h3>
            <p th:text="${item.getContent()}"></p>
            <ul class="actions">
              <li><a href="" class="button" th:href="@{|/boardDetail/${item.getBoardCate()}/${item.getSeqBoard()}|}">More</a>
              </li>
            </ul>
          </article>
        </div>
      </section>
    </div>
  </div>

  <!-- Sidebar -->
  <div th:replace="~{/layout/sidebar :: sidebar}"></div>

</div>

<!-- Scripts -->
<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/js/browser.min.js"></script>
<script src="/assets/js/breakpoints.min.js"></script>
<script src="/assets/js/util.js"></script>
<script src="/assets/js/main.js"></script>

</body>
</html>
