<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <title></title>
</head>
<body>
<header th:fragment="header" id="header">
  <a href="" class="logo" th:href="@{/index}"><strong>은호</strong>'s BLOG</a>
  <ul class="icons" th:if="${session.userId == null}">
    <li><a href="#" class="button primary" th:href="@{/login}">로그인</a></li>
  </ul>
  <ul class="icons" th:unless="${session.userId == null}">
    <li>
      <span class="navbar-text" th:text="|${session.userName} 님 반갑습니다.|"></span>
    </li>
    <li>
      <a href="#" class="button primary" id="btn-logout">로그아웃</a>
    </li>
  </ul>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script>
    $('#btn-logout').on('click', function () {
      $.ajax({
        url: '/logout',
        type: 'GET',
        success: function (response) {
          // 서버에서 "reload"라는 응답을 받으면 페이지를 리로드합니다.
          if (response === 'reload')
          {
            window.location.reload()
          }
        },
        error: function () {
          alert('로그아웃 처리 실패! 다시 시도해 주세요.')
        }
      })
    })
  </script>
</header>
</body>
</html>
