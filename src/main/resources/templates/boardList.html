<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <title>글 목록</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
  <link rel="stylesheet" href="/assets/css/main.css"/>
</head>
<body class="is-preload">

<!-- Wrapper -->
<div id="wrapper">

  <!-- Main -->
  <div id="main">
    <div class="inner">

      <!-- Header -->
      <header th:replace="~{/layout/header :: header}"></header>

      <!-- Content -->
      <section>
        <header class="main">
          <h3>글 목록</h3>
        </header>
        <div class="table-wrapper">
          <table class="table table-hover">
            <colgroup>
              <col style="width: 60%">
              <col style="width: 15%">
              <col style="width: 17%">
              <col style="width: 8%">
            </colgroup>
            <thead>
            <tr>
              <th>제목</th>
              <th>카테고리</th>
              <th>작성일</th>
              <th>추천</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.size(boardList) > 0}" th:each="item : ${boardList}">
              <td>
                <a href="#" class="text-decoration-none" th:href="@{|/boardDetail/${item.getBoardCate()}/${item.getSeqBoard()}|}" th:text="${item.getBoardTitle()}">
                </a>
              </td>
              <td th:text="${item.getBoardCate()}"></td>
              <td th:if="${item.getUpdateDate()} == ${item.getCreateDate()}" th:text="${item.getCreateDate()}"></td>
              <td th:if="${item.getUpdateDate()} != ${item.getCreateDate()}" th:text="${item.getUpdateDate()} + ' (수정)'"></td>
              <td th:text="${item.getLikeBoard()}"></td>
            </tr>
            <tr th:unless="${#lists.size(boardList) > 0}">
              <td colspan="3" class="text-center">조회된 데이터가 없습니다</td>
            </tr>
            </tbody>
          </table>
        </div>
        <div class="row mt-3">
          <div class="col-sm d-flex justify-content-end">
            <a href="/boardWrite" class="button primary" th:text="글쓰기">글쓰기</a>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- Sidebar -->
  <div th:replace="~{/layout/sidebar :: sidebar}"></div>

</div>

<!-- Scripts -->
<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/js/browser.min.js"></script>
<script src="/assets/js/breakpoints.min.js"></script>
<script src="/assets/js/util.js"></script>
<script src="/assets/js/main.js"></script>

</body>
</html>
