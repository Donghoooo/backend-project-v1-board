<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <title>글 수정</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
  <link rel="stylesheet" href="/assets/css/main.css"/>
  <script>
    $(document).ready(function () {
      $('#btn-cancel').on('click', function () {
        location.href = '/boardList'
      })
      $('#update').on('click', function () {
        $('#method').val('PUT')
        var seqBoard = $('#seqBoard').val() // 올바른 값 참조
        if (!seqBoard)
        {
          alert('수정할 게시글이 없습니다.')
          return
        }
        var frm = $('#frm')[0]
        frm.action = '/boardDetail/' + seqBoard
        frm.submit()
      })
    })
  </script>
</head>
<body class="is-preload">

<!-- Wrapper -->
<div id="wrapper">

  <!-- Main -->
  <div id="main">
    <div class="inner">

      <!-- Header -->
      <header th:replace="~{/layout/header :: header}"></header>

      <!-- Content -->
      <section>
        <header class="main">
          <h3>글 수정</h3>
        </header>
        <div class="row">
          <div class="col-sm-4 mx-auto">
            <form action="#" id="frm" method="post">
              <input type="hidden" id="method" name="_method">
              <input type="hidden" id="seqBoard" th:value="${board.getSeqBoard()}">
              <div class="mt-3">
                <label for="title" class="form-label">제목 : </label>
                <input type="text" class="form-control" id="title" name="title" placeholder="제목을 입력하세요"
                       th:value="${board.getBoardTitle()}">
              </div>
              <div class="mt-3">
                <label for="boardCateBox">카테고리 선택</label>
                <select id="boardCateBox" name="boardCate">
                  <option value="공지사항" th:text="'공지사항'" selected>공지사항</option>
                  <option th:each="category : ${boardCate}" th:if="${board.getBoardCate()} == ${category}" th:value="${category}" th:text="${category}" selected>
                  <option th:each="category : ${boardCate}" th:unless="${board.getBoardCate()} == ${category}" th:value="${category}" th:text="${category}">
                    카테고리
                  </option>
                  <option value="">기타 (직접 입력)</option>
                </select>
                <label for="customInput"></label>
                <input type="text" id="customInput" name="customCategory" class="form-control mt-2" placeholder="직접 입력" style="display: none;">
                <script>
                  document.getElementById('boardCateBox').addEventListener('change', function () {
                    const customInput = document.getElementById('customInput')
                    if (this.value === '')
                    {
                      customInput.style.display = 'block'
                      customInput.focus()
                    }
                    else
                    {
                      customInput.style.display = 'none'
                      customInput.value = ''
                    }
                  })
                </script>
              </div>
              <div class="mt-3">
                <label for="content" class="form-label">내용 : </label>
                <textarea class="form-control" id="content" name="content" rows="10" placeholder="내용을 입력하세요" th:text="${board.getContent()}"></textarea>
              </div>
              <!-- 첨부파일 추가 -->
              <div class="mt-3">
                <label for="upload-files" class="form-label">첨부파일 : </label>
                <input type="file" class="form-control" id="upload-files" name="uploadFiles" multiple>
              </div>
              <div class="mt-3 row">
                <div class="col-sm d-grid">
                  <button type="submit" id="update">수정하기</button>
                </div>
                <div class="col-sm d-grid">
                  <button type="reset" id="btn-cancel">수정취소</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- Sidebar -->
  <div th:replace="~{/layout/sidebar :: sidebar}"></div>

</div>

<!-- Scripts -->
<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/js/browser.min.js"></script>
<script src="/assets/js/breakpoints.min.js"></script>
<script src="/assets/js/util.js"></script>
<script src="/assets/js/main.js"></script>

</body>
</html>
