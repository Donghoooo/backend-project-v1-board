<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title th:text="${board.getBoardTitle()}"></title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
  <link rel="stylesheet" href="/assets/css/main.css"/>
  <script>
    $(document).ready(function () {
      $('#delete').on('click', function () {
        $('#method').val('DELETE')
        var seqBoard = $('#seqBoard').val()
        if (!seqBoard)
        {
          alert('삭제할 게시글이 없습니다.')
          return
        }
        var frm = $('#frm')[0]
        frm.action = '/boardDetail/' + seqBoard
        frm.submit()
      })
      $('#likeButton').on('click', function () {
        const boardSeq = $(this).data('board-seq')
        const boardCate = $(this).data('board-cate')

        $.ajax({
          url: `/boardDetail/${boardCate}/${boardSeq}/like`,
          type: 'POST',
          success: function (newLikeCount) {
            $('#likeCount').text(newLikeCount)
          },
          error: function () {
            alert('추천 실패! 다시 시도해 주세요.')
          }
        })
      })
    })
  </script>
</head>
<body class="is-preload">

<!-- Wrapper -->
<div id="wrapper">

  <!-- Main -->
  <div id="main">
    <div class="inner">

      <!-- Header -->
      <header th:replace="~{/layout/header :: header}"></header>

      <!-- Content -->
      <section style="position: relative;">
        <form action="#" id="frm" method="post">
          <input type="hidden" id="method" name="_method">
          <input type="hidden" id="seqBoard" th:value="${board.getSeqBoard()}">
          <header class="main">
            <h1 th:text="${board.getBoardTitle()}"></h1>
          </header>
          <p th:text="${board.getContent()}"></p>

          <!-- 오른쪽 위에 위치한 텍스트 -->
          <p th:if="${board.getUpdateDate()} == ${board.getCreateDate()}" th:text="${board.getCreateDate()}" style="position: absolute; top: 0; right: 0; margin: 10px;"></p>
          <p th:if="${board.getUpdateDate()} != ${board.getCreateDate()}" th:text="${board.getUpdateDate()}" style="position: absolute; top: 0; right: 0; margin: 10px;"></p>
          <div class="row mt-3">
            <div class="col-sm d-flex justify-content-center">
              <button type="button" id="likeButton" th:data-board-seq="${board.getSeqBoard()}" th:data-board-cate="${board.getBoardCate()}" class="like-btn">
                👍 추천 <span id="likeCount" th:text="${board.likeBoard}"></span>
              </button>
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-sm d-flex justify-content-end">
              <a th:href="@{/boardUpdate/{seqBoard}(seqBoard=${board.getSeqBoard()})}" class="button primary me-3" th:text="수정하기">수정하기</a>
              <button type="button" th:text="삭제하기" id="delete">삭제하기</button>
            </div>
          </div>
        </form>
      </section>
    </div>
  </div>

  <!-- Sidebar -->
  <div th:replace="~{/layout/sidebar :: sidebar}"></div>

</div>

<!-- Scripts -->
<script src="/assets/js/jquery.min.js"></script>
<script src="/assets/js/browser.min.js"></script>
<script src="/assets/js/breakpoints.min.js"></script>
<script src="/assets/js/util.js"></script>
<script src="/assets/js/main.js"></script>

</body>
</html>
